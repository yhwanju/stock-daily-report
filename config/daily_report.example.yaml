      symbol: "KRW=X"
    US10Y:
      symbol: "^TNX"
      scale: 0.1
    DXY:
      symbol: "DX-Y.NYB"
  commodities:
    WTI:
      symbol: "CL=F"
    Gold:
      symbol: "GC=F"
    Copper:
      symbol: "HG=F"
