name: Daily Stock Report

on:
  workflow_dispatch:
  schedule:
    # 09:00 KST on weekdays = 00:00 UTC on Monday-Friday.
    - cron: "0 0 * * 1-5"
    # 09:05 KST on weekdays = 00:05 UTC on Monday-Friday.
    - cron: "5 0 * * 1-5"

permissions:
  contents: read

concurrency:
  group: daily-stock-report
  cancel-in-progress: false

jobs:
  send-daily-report:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 * * 1-5'
    name: Build and send card news report
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Debug trigger context (UTC/KST)
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule || 'workflow_dispatch' }}
          TARGET_KST_TIME: "09:00"
        run: |
          echo "Trigger event: ${GITHUB_EVENT_NAME}"
          echo "Event schedule: ${EVENT_SCHEDULE}"
          echo "Current branch: ${GITHUB_REF_NAME}"
          echo "Workflow file path: ${GITHUB_WORKFLOW_REF}"
          echo "Target KST time: ${TARGET_KST_TIME}"
          echo "UTC time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Calculated KST time: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST')"

      - name: Check scheduled timing window
        id: timing_window
        if: github.event_name == 'schedule'
        env:
          TARGET_KST_TIME: "09:00"
          LATE_GRACE_MINUTES: "15"
        run: |
          set -Eeuo pipefail
          today_kst="$(TZ=Asia/Seoul date '+%Y-%m-%d')"
          target_epoch="$(TZ=Asia/Seoul date -d "${today_kst} ${TARGET_KST_TIME}:00" '+%s')"
          now_epoch="$(TZ=Asia/Seoul date '+%s')"
          late_seconds=$((now_epoch - target_epoch))
          echo "late_seconds=${late_seconds}"
          if [ "${late_seconds}" -gt $((LATE_GRACE_MINUTES * 60)) ]; then
            echo "::warning::Scheduled run is ${late_seconds}s after ${TARGET_KST_TIME} KST; skipping to avoid a late send."
            echo "should_send=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "should_send=true" >> "${GITHUB_OUTPUT}"

      - name: Checkout repository
        if: github.event_name == 'workflow_dispatch' || steps.timing_window.outputs.should_send == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: github.event_name == 'workflow_dispatch' || steps.timing_window.outputs.should_send == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        if: github.event_name == 'workflow_dispatch' || steps.timing_window.outputs.should_send == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        if: github.event_name == 'workflow_dispatch' || steps.timing_window.outputs.should_send == 'true'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Chromium and fonts
        if: github.event_name == 'workflow_dispatch' || steps.timing_window.outputs.should_send == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-color-emoji
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps chromium
          else
            python -m playwright install --with-deps chromium
          fi

      - name: Validate Discord webhook secret
        if: github.event_name == 'workflow_dispatch' || steps.timing_window.outputs.should_send == 'true'
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
            echo "::error::DISCORD_WEBHOOK_URL secret is not configured."
            exit 1
          fi

      - name: Generate and send daily report
        if: github.event_name == 'workflow_dispatch' || steps.timing_window.outputs.should_send == 'true'
        run: |
          set -Eeuo pipefail
          trap 'code=$?; echo "::error::Daily report failed at line ${LINENO} with exit code ${code}."; exit ${code}' ERR
          echo "Daily report job started at $(date '+%Y-%m-%d %H:%M:%S %Z')"
          python scripts/run_daily_report.py --once --template card_news --send
          echo "Daily report job finished at $(date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Upload generated report artifacts
        if: always() && (github.event_name == 'workflow_dispatch' || steps.timing_window.outputs.should_send == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-output
          path: output/
          if-no-files-found: warn
          retention-days: 7

  send-research-update:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '5 0 * * 1-5'
    name: Send research update brief
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Debug trigger context (UTC/KST)
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule || 'workflow_dispatch' }}
          TARGET_KST_TIME: "09:05"
        run: |
          echo "Trigger event: ${GITHUB_EVENT_NAME}"
          echo "Event schedule: ${EVENT_SCHEDULE}"
          echo "Current branch: ${GITHUB_REF_NAME}"
          echo "Workflow file path: ${GITHUB_WORKFLOW_REF}"
          echo "Target KST time: ${TARGET_KST_TIME}"
          echo "UTC time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Calculated KST time: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST')"

      - name: Check scheduled timing window
        id: timing_window
        if: github.event_name == 'schedule'
        env:
          TARGET_KST_TIME: "09:05"
          LATE_GRACE_MINUTES: "15"
        run: |
          set -Eeuo pipefail
          today_kst="$(TZ=Asia/Seoul date '+%Y-%m-%d')"
          target_epoch="$(TZ=Asia/Seoul date -d "${today_kst} ${TARGET_KST_TIME}:00" '+%s')"
          now_epoch="$(TZ=Asia/Seoul date '+%s')"
          late_seconds=$((now_epoch - target_epoch))
          echo "late_seconds=${late_seconds}"
          if [ "${late_seconds}" -gt $((LATE_GRACE_MINUTES * 60)) ]; then
            echo "::warning::Scheduled run is ${late_seconds}s after ${TARGET_KST_TIME} KST; skipping to avoid a late send."
            echo "should_send=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "should_send=true" >> "${GITHUB_OUTPUT}"

      - name: Checkout repository
        if: github.event_name == 'workflow_dispatch' || steps.timing_window.outputs.should_send == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: github.event_name == 'workflow_dispatch' || steps.timing_window.outputs.should_send == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        if: github.event_name == 'workflow_dispatch' || steps.timing_window.outputs.should_send == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Discord webhook secret
        if: github.event_name == 'workflow_dispatch' || steps.timing_window.outputs.should_send == 'true'
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
            echo "::error::DISCORD_WEBHOOK_URL secret is not configured."
            exit 1
          fi

      - name: Generate and conditionally send research update
        if: github.event_name == 'workflow_dispatch' || steps.timing_window.outputs.should_send == 'true'
        run: |
          set -Eeuo pipefail
          msg="$(python scripts/run_daily_report.py --once --template research_update --dry-run || true)"
          if [ -z "${msg}" ]; then
            echo "No meaningful research changes detected. Skip sending."
            exit 0
          fi
          python scripts/run_daily_report.py --once --template research_update --send
