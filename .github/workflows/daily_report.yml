name: Daily Stock Report

on:
  schedule:
    # 07:45 KST on weekdays = 22:45 UTC on Sunday-Thursday.
    - cron: "45 22 * * 0-4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-stock-report
  cancel-in-progress: false

jobs:
  send-daily-report:
    name: Build and send card news report
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji
          python -m playwright install --with-deps chromium

      - name: Validate Discord webhook secret
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
            echo "::error::DISCORD_WEBHOOK_URL secret is not configured."
            exit 1
          fi

      - name: Generate and send daily report
        run: |
          set -Eeuo pipefail
          trap 'code=$?; echo "::error::Daily report failed at line ${LINENO} with exit code ${code}."; exit ${code}' ERR
          echo "Daily report job started at $(date '+%Y-%m-%d %H:%M:%S %Z')"
          python scripts/run_daily_report.py --once --template card_news --send
          echo "Daily report job finished at $(date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Upload generated report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-output
          path: output/
          if-no-files-found: warn
          retention-days: 7
