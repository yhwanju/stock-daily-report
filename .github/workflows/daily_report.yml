name: Daily Stock Report

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-stock-report
  cancel-in-progress: false

jobs:
  send-daily-report:
    name: Build and send card news report
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Check KST send window
        id: timing_window
        run: |
          current_hm="$(TZ=Asia/Seoul date '+%H:%M')"
          echo "Current KST=${current_hm}"

          should_send=false

          if [[ "${current_hm}" > "07:39" && "${current_hm}" < "07:50" ]]; then
            should_send=true
          fi

          echo "should_send=${should_send}" >> "${GITHUB_OUTPUT}"

      - name: Checkout repository
        if: steps.timing_window.outputs.should_send == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.timing_window.outputs.should_send == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        if: steps.timing_window.outputs.should_send == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        if: steps.timing_window.outputs.should_send == 'true'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Chromium and fonts
        if: steps.timing_window.outputs.should_send == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-color-emoji
          python -m playwright install --with-deps chromium
          
      - name: Generate and send daily report
        if: steps.timing_window.outputs.should_send == 'true'
        run: |
          python scripts/run_daily_report.py --once --template card_news --send

  send-research-update:
    name: Send research update brief
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Check KST send window
        id: timing_window
        run: |
          current_hm="$(TZ=Asia/Seoul date '+%H:%M')"
          echo "Current KST=${current_hm}"

          should_send=false

          if [[ "${current_hm}" > "07:49" && "${current_hm}" < "08:00" ]]; then
            should_send=true
          fi

          echo "should_send=${should_send}" >> "${GITHUB_OUTPUT}"

      - name: Checkout repository
        if: steps.timing_window.outputs.should_send == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.timing_window.outputs.should_send == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        if: steps.timing_window.outputs.should_send == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and conditionally send research update
        if: steps.timing_window.outputs.should_send == 'true'
        run: |
          msg="$(python scripts/run_daily_report.py --once --template research_update --dry-run || true)"
          if [ -z "${msg}" ]; then
            exit 0
          fi
          python scripts/run_daily_report.py --once --template research_update --send
